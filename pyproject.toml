[build-system]
requires = ["setuptools>=61.0,<80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-fractal-memory"
version = "1.0.2"
description = "Hierarchical vectorless episodic memory, procedural attractor clustering, and O(1) coordinate anchoring for Hermes Agent."
readme = "README.md"
authors = [{ name = "Volkan Dagli", email = "ask@answerr.me" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<9.0.0",
    "pyyaml>=6.0,<7.0",
]

[tool.setuptools]
packages = ["hermes_fractal_memory"]
package-dir = {"hermes_fractal_memory" = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = [".git", ".pytest_cache", "__pycache__"]
addopts = "--ignore=__init__.py"

[project.urls]
"Homepage" = "https://github.com/pCwOrM/hermes-fractal-memory"
"Repository" = "https://github.com/pCwOrM/hermes-fractal-memory"
"Bug Tracker" = "https://github.com/pCwOrM/hermes-fractal-memory/issues"
